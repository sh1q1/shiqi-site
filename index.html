<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>shiqi.site/</title>
<!-- Cascadia Mono variable font — supports all weights + italic -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<style>
  /* Cascadia Mono — italic (cursive variant via ss01) */
  @font-face {
    font-family: 'Cascadia Mono';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/cascadia-mono:vf@latest/latin-wght-italic.woff2') format('woff2-variations');
    font-weight: 200 700;
    font-style: italic;
    font-display: swap;
  }
  /* Cascadia Mono — normal */
  @font-face {
    font-family: 'Cascadia Mono';
    src: url('https://cdn.jsdelivr.net/fontsource/fonts/cascadia-mono:vf@latest/latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 700;
    font-style: normal;
    font-display: swap;
  }
</style>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gx: 50%;
    --gy: 50%;
    --password: 'shiqi'; /* not used in CSS, just a note */
  }

  html, body {
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Cascadia Mono', 'Cascadia Code', 'Fira Code', 'Courier New', monospace;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ---- Background gradient layers ---- */

  /* Outer slow ambient glow */
  .bg-ambient {
    position: fixed;
    inset: -20%;
    background: radial-gradient(
      ellipse 55% 55% at var(--gx) var(--gy),
      #0a00e6 0%,
      #05008a 22%,
      #020040 42%,
      #000010 62%,
      #000000 78%
    );
    z-index: 0;
    will-change: background;
    transition: background 0.05s linear;
  }

  /* Inner tight bright core */
  .bg-core {
    position: fixed;
    inset: 0;
    background: radial-gradient(
      ellipse 28% 28% at var(--gx) var(--gy),
      rgba(30, 20, 255, 0.35) 0%,
      rgba(10, 0, 200, 0.15) 35%,
      transparent 65%
    );
    z-index: 0;
    will-change: background;
  }

  /* ---- Content ---- */
  #lock, #content {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #content {
    opacity: 0;
    pointer-events: none;
    position: fixed;
    inset: 0;
    transition: opacity 0.8s ease 0.2s;
  }
  #content.visible {
    opacity: 1;
    pointer-events: all;
  }

  #lock {
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #lock.out {
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
  }

  .inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    width: 381px;
    max-width: 90vw;
  }

  /* Title block */
  .title-block {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: center;
    padding: 40px 0;
    width: 100%;
  }

  .wordmark {
    font-family: 'Cascadia Mono', 'Cascadia Code', monospace;
    font-style: italic;
    font-weight: 200;
    font-variation-settings: 'wght' 200;
    font-feature-settings: 'ss01' 1, 'calt' 1;
    font-size: 64px;
    letter-spacing: -3.2px;
    color: #fff;
    line-height: 1.4;
    width: 100%;
    text-align: left;
  }

  .wip-label {
    font-family: 'Cascadia Mono', 'Cascadia Code', monospace;
    font-weight: 700;
    font-style: normal;
    font-size: 20px;
    letter-spacing: 0.4px;
    color: #fff;
    text-align: center;
    width: 100%;
  }

  /* Password input */
  .pw-wrap {
    width: 100%;
    border-bottom: 1px solid rgba(255,255,255,0.5);
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .pw-input {
    background: transparent;
    border: none;
    outline: none;
    width: 100%;
    font-family: 'Cascadia Mono', monospace;
    font-weight: 300;
    font-size: 20px;
    letter-spacing: 0.02em;
    color: #fff;
    text-align: center;
    caret-color: #fff;
  }

  .pw-input::placeholder {
    color: rgba(255,255,255,0.5);
    font-weight: 300;
  }

  .pw-input.error {
    animation: shake 0.35s ease;
  }

  /* Enter button */
  .enter-btn {
    background: #fff;
    border: 1px solid #fff;
    padding: 12px 24px;
    cursor: pointer;
    font-family: 'Cascadia Mono', monospace;
    font-weight: 400;
    font-size: 24px;
    letter-spacing: -0.05em;
    color: blue;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
    line-height: 1.4;
  }

  .enter-btn:hover {
    background: transparent;
    color: #fff;
  }

  .enter-btn:active {
    transform: scale(0.98);
  }

  /* Error hint */
  .pw-hint {
    font-family: 'Cascadia Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,100,100,0.8);
    height: 16px;
    opacity: 0;
    transition: opacity 0.2s;
    margin-top: -12px;
  }
  .pw-hint.show { opacity: 1; }

  /* WIP content (post-password) */
  .wip-content {
    text-align: center;
  }
  .wip-content .wordmark {
    text-align: center;
    margin-bottom: 1rem;
    font-size: clamp(36px, 6vw, 56px);
  }
  .wip-body {
    font-family: 'Cascadia Mono', monospace;
    font-weight: 300;
    font-size: 14px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.5);
    line-height: 1.8;
    margin-top: 0.5rem;
  }
  .wip-contact {
    margin-top: 2rem;
    font-family: 'Cascadia Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 2px;
    transition: color 0.2s, border-color 0.2s;
  }
  .wip-contact:hover {
    color: rgba(255,255,255,0.8);
    border-color: rgba(255,255,255,0.5);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-7px); }
    60%       { transform: translateX(7px); }
    80%       { transform: translateX(-3px); }
  }

  /* Touch/mobile: no cursor, gradient stays centered with slow drift */
  @media (hover: none) {
    .bg-ambient { animation: drift 8s ease-in-out infinite alternate; }
    @keyframes drift {
      from { --gx: 45%; --gy: 45%; }
      to   { --gx: 55%; --gy: 55%; }
    }
  }
</style>
</head>
<body>

<div class="bg-ambient" id="bg-ambient"></div>
<div class="bg-core"    id="bg-core"></div>

<!-- Lock screen -->
<div id="lock">
  <div class="inner">
    <div class="title-block">
      <div class="wordmark">shiqi.site/</div>
      <div class="wip-label">Work in progress...</div>
    </div>
    <div class="pw-wrap">
      <input
        class="pw-input"
        id="pw"
        type="password"
        placeholder="Password"
        autocomplete="off"
        autofocus
      >
    </div>
    <div class="pw-hint" id="pw-hint">Incorrect password</div>
    <button class="enter-btn" id="pw-btn">Enter</button>
  </div>
</div>

<!-- Content (shown after unlock) -->
<div id="content">
  <div class="inner wip-content">
    <div class="wordmark">shiqi.site/</div>
    <div class="wip-body">
      Type design & graphic work.<br>
      New site coming soon.
    </div>
    <a href="mailto:shiiiqiiii@gmail.com" class="wip-contact">shiiiqiiii@gmail.com</a>
  </div>
</div>

<script>
  /* ---- Change password here ---- */
  var PASSWORD = 'shiqi';

  /* ---- Cursor-following gradient ---- */
  var bgAmbient = document.getElementById('bg-ambient');
  var bgCore    = document.getElementById('bg-core');
  var tx = 50, ty = 50; /* target */
  var cx = 50, cy = 50; /* current (lerped) */

  document.addEventListener('mousemove', function(e) {
    tx = (e.clientX / window.innerWidth)  * 100;
    ty = (e.clientY / window.innerHeight) * 100;
  });

  /* Also respond to touch */
  document.addEventListener('touchmove', function(e) {
    var t = e.touches[0];
    tx = (t.clientX / window.innerWidth)  * 100;
    ty = (t.clientY / window.innerHeight) * 100;
  }, { passive: true });

  function tick() {
    /* Smooth lerp — ambient follows slowly, core follows a bit faster */
    cx += (tx - cx) * 0.04;
    cy += (ty - cy) * 0.04;

    var pos = cx.toFixed(2) + '% ' + cy.toFixed(2) + '%';

    bgAmbient.style.background =
      'radial-gradient(ellipse 55% 55% at ' + pos + ', ' +
      '#0a00e6 0%, #05008a 22%, #020040 42%, #000010 62%, #000000 78%)';

    bgCore.style.background =
      'radial-gradient(ellipse 28% 28% at ' + pos + ', ' +
      'rgba(30,20,255,0.35) 0%, rgba(10,0,200,0.15) 35%, transparent 65%)';

    requestAnimationFrame(tick);
  }
  tick();

  /* ---- Password logic ---- */
  var input   = document.getElementById('pw');
  var hint    = document.getElementById('pw-hint');
  var btn     = document.getElementById('pw-btn');
  var lock    = document.getElementById('lock');
  var content = document.getElementById('content');

  function unlock() {
    if (input.value === PASSWORD) {
      sessionStorage.setItem('shiqi-wip', '1');
      lock.classList.add('out');
      setTimeout(function() {
        lock.style.display = 'none';
        content.classList.add('visible');
      }, 600);
    } else {
      input.classList.add('error');
      hint.classList.add('show');
      setTimeout(function() {
        input.classList.remove('error');
        input.value = '';
        input.focus();
      }, 400);
    }
  }

  if (sessionStorage.getItem('shiqi-wip') === '1') {
    lock.style.display = 'none';
    content.style.transition = 'none';
    content.classList.add('visible');
  }

  btn.addEventListener('click', unlock);
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') unlock();
    hint.classList.remove('show');
  });
</script>
</body>
</html>
